<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Helixona hub: every application, mockup and tool in one place" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <title>Helixona Hub</title>
  <style>
    :root {
      --bg: #050505; --bg-2: #0d0c0b; --surface: rgba(255,255,255,0.035); --surface-hover: rgba(255,255,255,0.07);
      --line: rgba(255,255,255,0.09); --line-strong: rgba(255,255,255,0.16);
      --text: #f3efe7; --muted: #a39b8f; --faint: #6d665d;
      --gold: #d4b77a; --gold-2: #e6cf99; --gold-dim: rgba(212,183,122,0.16);
      --live: #5fc08a; --internal: #e0a04c; --external: #7ea6e0; --soon: #6d665d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; color: var(--text); font-family: "Jost", "Futura", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background: var(--bg);
      background-image:
        radial-gradient(900px 420px at 50% -10%, rgba(212,183,122,0.16), transparent 70%),
        radial-gradient(700px 500px at 100% 110%, rgba(212,183,122,0.06), transparent 60%);
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px; }

    /* Top bar */
    .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; }
    .bar img { height: 26px; width: auto; display: block; opacity: 0.95; }
    .bar .domain { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }

    /* Hero */
    .hero { text-align: center; padding: 18px 0 12px; }
    .hero h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1; margin: 0; letter-spacing: 0.01em; }
    .hero h1 em { font-style: italic; color: var(--gold-2); }
    .hero p { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

    /* Controls */
    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 16px; }
    .chip { font: inherit; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: all .15s; }
    .chip:hover { color: var(--text); border-color: var(--line-strong); }
    .chip.on { color: #111; background: var(--gold); border-color: var(--gold); }
    .chip .n { opacity: 0.6; margin-left: 5px; }
    .search { position: relative; margin-left: 10px; }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
    .search input { font: inherit; font-size: 13px; width: 220px; padding: 8px 12px 8px 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }

    /* Grid */
    main { flex: 1; min-height: 0; overflow: auto; padding: 12px 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 290px)); justify-content: center; gap: 14px; }
    .tile {
      position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 196px; padding: 18px 20px 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .tile.link { cursor: pointer; }
    .tile.link:hover { background: var(--surface-hover); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 14px 36px rgba(0,0,0,0.5), 0 0 24px rgba(212,183,122,0.18); }
    .tile.link:hover .arrow { opacity: 1; transform: translate(0,0); }
    .tile.soon { border-style: dashed; opacity: 0.55; }
    .tile .main-link::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
    .tile .row { display: flex; align-items: center; justify-content: space-between; }
    .icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-dim); border: 1px solid rgba(212,183,122,0.25); }
    .icon svg { width: 22px; height: 22px; stroke: var(--gold-2); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--soon)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot, var(--soon)) 22%, transparent); }
    .status.live { --dot: var(--live); } .status.internal { --dot: var(--internal); } .status.external { --dot: var(--external); } .status.soon { --dot: var(--soon); }
    .tile h3 { margin: 6px 0 0; font-size: 19px; font-weight: 600; line-height: 1.2; }
    .tile h3 .main-link { position: static; }
    .tile p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tile .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 34px; }
    .tile .host { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .group { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); opacity: 0.85; }
    .arrow { position: absolute; right: 16px; bottom: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #111; display: grid; place-items: center; opacity: 0; transform: translate(-4px, 4px); transition: all .18s; }
    .arrow svg { width: 13px; height: 13px; stroke: #111; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .links { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .links a { font-size: 12px; color: var(--gold-2); border-bottom: 1px solid rgba(212,183,122,0.35); }
    .links a:hover { border-color: var(--gold-2); }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }

    footer { flex: none; text-align: center; color: var(--faint); font-size: 11.5px; padding: 10px 0 16px; border-top: 1px solid var(--line); }
    footer a { color: var(--muted); }

        @media (max-width: 800px) { .hero h1 { font-size: 36px; } .wrap { padding: 0 18px; } }
    @media (max-width: 520px) { .grid { grid-template-columns: minmax(0, 1fr); } .search input { width: 100%; } .search { width: 100%; margin: 6px 0 0; } }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="bar">
      <img src="./logo-on-dark.png" alt="Helixona" />
      <span class="domain">platforms.helixona.com</span>
    </div>
    <div class="hero">
      <h1>Helixona <em>Hub</em></h1>
      <p>Every Helixona system and mockup in one place. Choose a tile to open it in a new tab.</p>
    </div>
    <div class="controls" id="chips"></div>
  </header>

  <main class="wrap"><div class="grid" id="grid"></div></main>

  <footer><div class="wrap">Internal directory for the Helixona team · to add or change a tile, edit <a href="https://github.com/crpozo/helixona-main/blob/main/systems.js">systems.js</a> · mockups contain sample data only</div></footer>

  <script>
    // Always fetch the latest list (bypasses browser and CDN caching of systems.js).
    document.write('<script src="./systems.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    const ICONS = {
      app: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
      phone: '<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
      bot: '<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 4h8M9 14h.01M15 14h.01M2 13v3M22 13v3"/></svg>',
      card: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
      form: '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
      clinic: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/><path d="M9 11h2l1-2 1.5 4 1-2H16"/></svg>',
      code: '<svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',
      globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
      billing: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 16V11M12 16V8M16 16v-3"/></svg>',
      spark: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>',
      grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    };
    const STATUS = { live: "Live", internal: "Internal", external: "External", soon: "Coming soon" };
    const ARROW = '<span class="arrow"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg></span>';
    const grid = document.getElementById("grid"), chips = document.getElementById("chips");
    const groups = window.HELIXONA_SYSTEMS || [];
    const all = groups.flatMap(g => g.items.map(it => ({ ...it, group: g.group })));
    let active = "All", query = "";

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const host = u => u.replace(/^https?:\/\//, "").replace(/\/$/, "");

    function tile(it) {
      const has = it.url && it.status !== "soon";
      const name = has ? `<a class="main-link" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
      const links = (it.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
      return `<div class="tile${has ? " link" : " soon"}">
        <div class="row"><span class="icon">${ICONS[it.icon] || ICONS.grid}</span><span class="status ${esc(it.status)}">${STATUS[it.status] || esc(it.status)}</span></div>
        <h3>${name}</h3>
        <p>${esc(it.description)}</p>
        ${links ? `<div class="links">${links}</div>` : ""}
        <div class="foot"><span class="group">${esc(it.group)}</span>${has ? `<span class="host">${esc(host(it.url))}</span>` : ""}</div>
        ${has ? ARROW : ""}
      </div>`;
    }

    function render() {
      const q = query.trim().toLowerCase();
      const items = all.filter(it => (active === "All" || it.group === active) && (!q || [it.name, it.description, it.group, it.url, ...(it.tags || [])].join(" ").toLowerCase().includes(q)));
      grid.innerHTML = items.length ? items.map(tile).join("") : `<p class="empty">Nothing matches “${esc(query)}”.</p>`;
      chips.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.g === active));
    }

    chips.innerHTML = [["All", all.length], ...groups.map(g => [g.group, g.items.length])]
      .map(([g, n]) => `<button class="chip" data-g="${esc(g)}">${esc(g)}<span class="n">${n}</span></button>`).join("")
      + `<label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off" /></label>`;
    chips.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { active = b.dataset.g; render(); } });
    document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
    render();
  </script>
</body>
</html>
