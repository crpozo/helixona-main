<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Helixona project tracker: weekly status of every project" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <title>Helixona Project Tracker</title>
  <style>
    :root {
      --bg: #050505; --surface: rgba(255,255,255,0.035); --surface-hover: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.09); --line-strong: rgba(255,255,255,0.16);
      --text: #f3efe7; --muted: #a39b8f; --faint: #6d665d;
      --gold: #d4b77a; --gold-2: #e6cf99; --gold-dim: rgba(212,183,122,0.16);
      --on-track: #5fc08a; --waiting: #e0a04c; --blocked: #e0705f; --not-started: #8d867c; --done: #7ea6e0; --tbd: #6d665d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; color: var(--text); font-family: "Jost", "Futura", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background: var(--bg);
      background-image: radial-gradient(900px 420px at 50% -10%, rgba(212,183,122,0.16), transparent 70%);
      background-repeat: no-repeat;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px; }

    .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; }
    .bar img { height: 26px; width: auto; display: block; opacity: 0.95; }
    .bar .back { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
    .bar .back:hover { color: var(--gold-2); }

    .hero { text-align: center; padding: 18px 0 12px; }
    .hero h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1; margin: 0; letter-spacing: 0.01em; }
    .hero h1 em { font-style: normal; color: var(--gold-2); }
    .hero p { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 16px; }
    .chip { font: inherit; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: all .15s; }
    .chip:hover { color: var(--text); border-color: var(--line-strong); }
    .chip.on { color: #111; background: var(--gold); border-color: var(--gold); }
    .chip .n { opacity: 0.6; margin-left: 5px; }
    .search { position: relative; margin-left: 10px; }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
    .search input { font: inherit; font-size: 13px; width: 220px; padding: 8px 12px 8px 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }

    main { flex: 1; padding: 12px 0 24px; }
    .table { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
    .head, .proj { display: grid; grid-template-columns: 1.25fr 0.7fr 1.3fr 0.6fr 1.1fr 1.2fr 0.5fr; gap: 18px; padding: 16px 20px; }
    .head { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--line-strong); padding-top: 13px; padding-bottom: 13px; }
    .proj { border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; transition: background .15s; }
    .proj:last-child { border-bottom: 0; }
    .proj:hover { background: var(--surface-hover); }
    .proj > div { min-width: 0; overflow-wrap: anywhere; }
    .proj h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
    .proj h3 a { border-bottom: 1px solid rgba(212,183,122,0.35); }
    .proj h3 a:hover { color: var(--gold-2); border-color: var(--gold-2); }
    .proj .summary { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
    .proj ul { margin: 0; padding: 0 0 0 16px; }
    .proj li { margin: 0 0 3px; }
    .proj li::marker { color: var(--gold); }
    .none { color: var(--faint); }
    .date { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .label { display: none; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }

    .status { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); white-space: nowrap; }
    .status::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot) 22%, transparent); }
    .status.on-track { --dot: var(--on-track); } .status.waiting { --dot: var(--waiting); } .status.blocked { --dot: var(--blocked); }
    .status.not-started { --dot: var(--not-started); } .status.done { --dot: var(--done); } .status.tbd { --dot: var(--tbd); color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; margin: 0; }

    footer { flex: none; text-align: center; color: var(--faint); font-size: 11.5px; padding: 10px 0 16px; border-top: 1px solid var(--line); }
    footer a { color: var(--muted); }

    @media (max-width: 980px) {
      .wrap { padding: 0 18px; }
      .hero h1 { font-size: 36px; }
      .head { display: none; }
      .proj { grid-template-columns: 1fr 1fr; gap: 14px 18px; }
      .proj .c-name { grid-column: 1 / -1; }
      .label { display: block; }
    }
    @media (max-width: 520px) {
      .proj { grid-template-columns: minmax(0, 1fr); }
      .search, .search input { width: 100%; } .search { margin: 6px 0 0; }
    }
    @media print {
      body { background: #fff; color: #111; }
      .controls, .bar .back { display: none; }
      .table, .proj, .head { border-color: #ccc; background: none; }
      .head, .label, .proj li::marker { color: #555; }
      .status, .proj .summary, .date, .hero p, .none { color: #333; }
      .hero h1 em { color: inherit; }
      .proj { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="bar">
      <a href="./"><img src="./logo-on-dark.png" alt="Helixona" /></a>
      <a class="back" href="./">← Helixona Hub</a>
    </div>
    <div class="hero">
      <h1>Project <em>Tracker</em></h1>
      <p id="sub">Weekly status of every Helixona project.</p>
    </div>
    <div class="controls" id="chips"></div>
  </header>

  <main class="wrap">
    <div class="table">
      <div class="head"><div>Project</div><div>Status</div><div>Next steps</div><div>Responsible</div><div>Waiting on</div><div>Outstanding items</div><div>Updated</div></div>
      <div id="rows"></div>
    </div>
  </main>

  <footer><div class="wrap">Updated weekly · to change a project, edit <a href="https://github.com/crpozo/helixona-main/blob/main/projects.js">projects.js</a></div></footer>

  <script>
    // Always fetch the latest list (bypasses browser and CDN caching of projects.js).
    document.write('<script src="./projects.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    const STATUS = { "on-track": "On track", waiting: "Waiting", blocked: "Blocked", "not-started": "Not started", done: "Done", tbd: "To update" };
    const data = window.HELIXONA_TRACKER || { projects: [] };
    const all = data.projects || [];
    const rows = document.getElementById("rows"), chips = document.getElementById("chips");
    let active = "all", query = "";

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? esc(d) : t.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
    const list = (a, none) => (a && a.length) ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="none">${none}</span>`;
    const cell = (cls, label, html) => `<div class="${cls}"><span class="label">${label}</span>${html}</div>`;

    function row(p) {
      const st = STATUS[p.status] ? p.status : "tbd";
      const pending = st === "tbd" ? "To be filled in" : "Nothing";
      const name = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
      return `<div class="proj">
        <div class="c-name"><h3>${name}</h3>${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}</div>
        ${cell("c-status", "Status", `<span class="status ${st}">${STATUS[st]}</span>`)}
        ${cell("c-next", "Next steps", list(p.nextSteps, "To be filled in"))}
        ${cell("c-owner", "Responsible", p.owner ? esc(p.owner) : `<span class="none">Unassigned</span>`)}
        ${cell("c-wait", "Waiting on", list(p.waitingOn, pending))}
        ${cell("c-out", "Outstanding items", list(p.outstanding, pending))}
        ${cell("c-date", "Updated", `<span class="date">${p.updated ? fmt(p.updated) : "—"}</span>`)}
      </div>`;
    }

    function render() {
      const q = query.trim().toLowerCase();
      const items = all.filter(p => (active === "all" || (STATUS[p.status] ? p.status : "tbd") === active)
        && (!q || [p.name, p.summary, p.owner, STATUS[p.status], ...(p.nextSteps || []), ...(p.waitingOn || []), ...(p.outstanding || [])].join(" ").toLowerCase().includes(q)));
      rows.innerHTML = items.length ? items.map(row).join("") : `<p class="empty">No projects match.</p>`;
      chips.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.s === active));
    }

    if (data.updated) document.getElementById("sub").textContent = `Weekly status of every Helixona project · last reviewed ${fmt(data.updated)}`;
    const count = s => all.filter(p => (STATUS[p.status] ? p.status : "tbd") === s).length;
    chips.innerHTML = [["all", "All", all.length], ...Object.entries(STATUS).map(([s, l]) => [s, l, count(s)]).filter(c => c[2])]
      .map(([s, l, n]) => `<button class="chip" data-s="${s}">${l}<span class="n">${n}</span></button>`).join("")
      + `<label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off" /></label>`;
    chips.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { active = b.dataset.s; render(); } });
    document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
    render();
  </script>
</body>
</html>
